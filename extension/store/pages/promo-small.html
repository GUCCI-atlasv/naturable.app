<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Promo 440×280</title>
<!-- Chrome Web Store small promo tile. Store guidance: little text, saturated color, fills the frame, works at half size. -->
<style>
  @font-face { font-family: "Source Serif 4"; src: url("source-serif-4-latin.woff2") format("woff2"); font-weight: 200 900; }
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body { background: radial-gradient(120% 140% at 0% 0%, #C8603D 0%, #A2462A 55%, #7E3520 100%); position: relative; font-family: "Source Serif 4", Georgia, serif; }
  .mark { position: absolute; left: 36px; top: 40px; display: flex; align-items: center; gap: 14px; }
  .mark img { object-view-box: inset(16px); width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 0 0 3px #FFF6EE, 0 8px 22px rgba(40,10,0,.35); }
  .mark span { font-size: 46px; font-weight: 700; color: #FFF6EE; letter-spacing: -0.01em; }
  /* Abstract "text with underlines": no readable copy, reads at half size. */
  .lines { position: absolute; left: 36px; right: 36px; bottom: 40px; display: flex; flex-direction: column; gap: 14px; }
  .l { display: flex; gap: 10px; align-items: flex-end; height: 14px; }
  .b { height: 10px; border-radius: 5px; background: rgba(255,246,238,.38); }
  .hit { height: 10px; border-radius: 5px; background: rgba(255,246,238,.92); position: relative; }
  .hit::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; border-bottom: 4px solid #FFD27A; border-radius: 2px; }
  .hit.sugg::after { border-bottom-style: dotted; }
</style>
</head>
<body>
  <div class="mark"><img src="icon-mark.png" alt=""><span>Naturable</span></div>
  <div class="lines">
    <div class="l"><span class="b" style="width:70px"></span><span class="hit" style="width:84px"></span><span class="b" style="width:150px"></span></div>
    <div class="l"><span class="b" style="width:120px"></span><span class="b" style="width:60px"></span><span class="hit sugg" style="width:100px"></span><span class="b" style="width:40px"></span></div>
    <div class="l"><span class="hit" style="width:110px"></span><span class="b" style="width:170px"></span></div>
  </div>
</body>
</html>
