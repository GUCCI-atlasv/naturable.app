<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naturable</title>
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header class="top">
  <span class="brand">Naturable<span class="dot">.</span></span>
  <label class="field"><span>Writing for</span>
    <select id="purpose">
      <option value="general">General</option>
      <option value="email">Email</option>
      <option value="blog">Blog</option>
      <option value="marketing">Marketing</option>
      <option value="social">Social</option>
      <option value="academic">Academic</option>
      <option value="technical">Technical</option>
    </select>
  </label>
</header>

<main>
  <label class="sr-only" for="text">Text to check</label>
  <textarea id="text" spellcheck="true" placeholder="Paste a draft, or select text on a page and choose “Check with Naturable” from the right-click menu."></textarea>

  <section class="summary" aria-live="polite">
    <div class="score"><span class="num ink-none" id="score">—</span><span class="of">/100</span></div>
    <div>
      <div class="band" id="band">Waiting for text</div>
      <div class="counts" id="counts"></div>
    </div>
  </section>
  <p class="note">A pattern score: higher reads more natural. It is not an AI detector and says nothing about who wrote the text.</p>

  <ol class="findings" id="findings"></ol>
  <p class="clean" id="clean" hidden>No common AI writing patterns found.</p>
</main>

<footer class="foot">
  <span>Runs on this device. Nothing is uploaded.</span>
  <span>Rules <span id="version"></span> · <a href="https://naturable.app/en/how-it-works/" target="_blank" rel="noopener">How it works</a></span>
</footer>
<script src="../vendor/naturable.iife.js"></script>
<script src="../shared/docs-words.js"></script>
<script src="../shared/common.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
